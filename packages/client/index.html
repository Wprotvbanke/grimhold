<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Grimhold</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #d8d0c0;
        --dim: #8a8377;
        --gold: #c2ac74;
        --line: #3d382e;
        --panel: rgba(12, 12, 14, 0.88);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0a0a0c; }
      body { font: 13px/1.55 ui-monospace, "Cascadia Mono", Consolas, monospace; color: var(--ink); }
      canvas { display: block; }

      .screen {
        position: fixed; inset: 0; display: grid; place-items: center; z-index: 20;
        background: radial-gradient(circle at 50% 40%, #1a1a22, #050506 72%);
        padding: 24px; overflow-y: auto;
      }
      .screen[hidden] { display: none; }

      .panel {
        width: min(440px, 100%); background: var(--panel);
        border: 1px solid var(--line); border-radius: 6px; padding: 26px;
      }
      h1 {
        margin: 0 0 6px; font-size: 30px; letter-spacing: 0.2em; font-weight: 500;
        text-transform: uppercase; color: var(--gold); text-align: center;
      }
      .subtitle { margin: 0 0 22px; text-align: center; color: var(--dim); font-size: 12px; }
      h2 { margin: 0 0 14px; font-size: 14px; font-weight: 500; color: var(--gold); letter-spacing: 0.08em; }

      label { display: block; margin-bottom: 12px; color: var(--dim); font-size: 12px; }
      input, select, button {
        width: 100%; margin-top: 5px; padding: 9px 11px; font: inherit;
        background: #121216; color: var(--ink);
        border: 1px solid var(--line); border-radius: 4px;
      }
      input:focus, select:focus { outline: none; border-color: var(--gold); }

      button {
        margin-top: 8px; cursor: pointer; color: #16140f; background: var(--gold);
        border-color: var(--gold); font-weight: 600; letter-spacing: 0.05em;
      }
      button:hover { background: #d6bd80; }
      button.ghost { background: transparent; color: var(--dim); border-color: var(--line); font-weight: 400; }
      button.ghost:hover { color: var(--ink); border-color: var(--gold); }

      .row { display: flex; gap: 10px; }
      .row > * { flex: 1; }

      .error { min-height: 18px; margin: 6px 0 0; color: #d08a72; font-size: 12px; text-align: center; }

      .char {
        display: flex; justify-content: space-between; align-items: center; gap: 12px;
        padding: 11px 13px; margin-bottom: 8px; cursor: pointer;
        border: 1px solid var(--line); border-radius: 4px; background: #101014;
      }
      .char:hover { border-color: var(--gold); }
      .char .meta { color: var(--dim); font-size: 11px; }
      .char strong { font-weight: 500; color: var(--ink); }

      .hint { margin-top: 16px; color: #6f6a60; font-size: 11px; text-align: center; line-height: 1.7; }

      #crosshair {
        position: fixed; left: 50%; top: 50%; width: 3px; height: 3px;
        margin: -1.5px 0 0 -1.5px; background: #e6dcc6; border-radius: 50%;
        opacity: 0.65; pointer-events: none; z-index: 5;
      }
      #hud {
        position: fixed; left: 12px; bottom: 12px; z-index: 5; color: #a49c8c;
        white-space: pre; pointer-events: none; text-shadow: 0 1px 3px #000;
      }
      #labels { position: fixed; inset: 0; pointer-events: none; z-index: 6; }
      .nametag {
        position: absolute; transform: translate(-50%, -100%);
        padding: 1px 6px; background: rgba(8, 8, 10, 0.78);
        border: 1px solid var(--line); border-radius: 3px;
        color: #d5c9ab; font-size: 12px; white-space: nowrap;
      }

      /* ---------- бой ---------- */
      #vitals {
        position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
        width: min(420px, 62vw); z-index: 7; pointer-events: none;
      }
      .bar {
        position: relative; height: 13px; margin-bottom: 4px; border-radius: 2px;
        background: rgba(6, 6, 8, 0.75); border: 1px solid #2b2721; overflow: hidden;
      }
      .bar > i {
        display: block; height: 100%; width: 100%; transform-origin: left center;
        transition: transform 0.12s linear;
      }
      .bar > span {
        position: absolute; inset: 0; text-align: center; font-size: 10px;
        line-height: 13px; color: #e2d9c4; text-shadow: 0 1px 2px #000;
      }
      #barHealth > i { background: linear-gradient(90deg, #8d2f2a, #c14b3f); }
      #barStamina > i { background: linear-gradient(90deg, #6f6321, #b6a244); }
      #barMana > i { background: linear-gradient(90deg, #29497f, #4a7ec0); }

      #spellbar {
        display: flex; gap: 5px; justify-content: center; margin-top: 8px;
        pointer-events: none;
      }
      .spell {
        flex: 1; padding: 4px 2px; text-align: center; font-size: 10px;
        background: rgba(8, 8, 10, 0.8); border: 1px solid #3d382e; border-radius: 3px;
        color: #a99e86; line-height: 1.35;
      }
      .spell b { display: block; color: var(--gold); font-size: 11px; font-weight: 500; }
      .spell.ready { border-color: #6d6249; color: #cfc4a8; }
      .spell.cooling { opacity: 0.4; }

      #damage { position: fixed; inset: 0; pointer-events: none; z-index: 8; overflow: hidden; }
      .dmg {
        position: absolute; font-size: 15px; font-weight: 600; white-space: nowrap;
        text-shadow: 0 2px 4px #000; animation: rise 1s ease-out forwards;
      }
      .dmg.out { color: #e8d9a8; }
      .dmg.in { color: #e07a63; font-size: 18px; }
      .dmg.crit { color: #ffb454; font-size: 20px; }
      .dmg.blocked { color: #9db4cc; }
      .dmg.dodged { color: #9dcca8; }
      .dmg.heal { color: #86c98a; }
      @keyframes rise {
        from { opacity: 1; transform: translate(-50%, 0) scale(1); }
        to { opacity: 0; transform: translate(-50%, -60px) scale(1.1); }
      }

      #hurt {
        position: fixed; inset: 0; pointer-events: none; z-index: 4; opacity: 0;
        background: radial-gradient(ellipse at center, transparent 35%, rgba(140, 20, 16, 0.75) 100%);
        transition: opacity 0.28s ease-out;
      }

      #deathScreen {
        position: fixed; inset: 0; z-index: 15; display: grid; place-items: center;
        background: rgba(4, 3, 3, 0.86); text-align: center;
      }
      #deathScreen[hidden] { display: none; }
      #deathScreen h2 {
        font-size: 32px; letter-spacing: 0.25em; color: #a8352c;
        text-transform: uppercase; margin: 0 0 10px; font-weight: 500;
      }
      #deathScreen p { color: var(--dim); margin: 0 0 20px; }
      #respawnBtn { width: 220px; }

      #targetInfo {
        position: fixed; left: 50%; top: 12%; transform: translateX(-50%);
        z-index: 7; text-align: center; pointer-events: none; min-height: 34px;
      }
      #targetInfo .tname { color: #d8cdb2; text-shadow: 0 1px 3px #000; font-size: 13px; }
      #targetBar {
        width: 190px; height: 6px; margin: 3px auto 0; border-radius: 2px;
        background: rgba(6, 6, 8, 0.8); border: 1px solid #2b2721; overflow: hidden;
      }
      #targetBar > i {
        display: block; height: 100%; width: 100%; transform-origin: left center;
        background: linear-gradient(90deg, #7d2b26, #b8453a);
      }
      #targetInfo[hidden] { display: none; }

      #chat {
        position: fixed; left: 12px; top: 12px; width: 380px; max-width: 46vw; z-index: 7;
      }
      #chatLog {
        max-height: 190px; overflow-y: auto; padding: 6px 8px;
        background: rgba(8, 8, 10, 0.5); border-radius: 4px;
        text-shadow: 0 1px 3px #000; font-size: 12px;
      }
      #chatLog:empty { display: none; }
      #chatLog div { margin-bottom: 2px; word-wrap: break-word; }
      .ch-local { color: #cfc6b2; }
      .ch-global { color: #93b6d8; }
      .ch-system { color: #b79a6b; font-style: italic; }
      .ch-from { color: var(--gold); }

      #chatInput {
        margin-top: 6px; background: rgba(10, 10, 12, 0.92);
        border-color: var(--gold); width: 100%;
      }
      #chatInput[hidden] { display: none; }

      #pauseHint {
        position: fixed; inset: 0; display: grid; place-items: center; z-index: 8;
        background: rgba(5, 5, 6, 0.72); cursor: pointer; text-align: center; color: var(--dim);
      }
      #pauseHint[hidden] { display: none; }
      #pauseHint strong { display: block; color: var(--gold); font-size: 18px; margin-bottom: 8px; letter-spacing: 0.1em; }
    </style>
  </head>
  <body>
    <div id="crosshair"></div>
    <div id="labels"></div>
    <div id="hud"></div>
    <div id="hurt"></div>
    <div id="damage"></div>

    <div id="targetInfo" hidden>
      <div class="tname" id="targetName"></div>
      <div id="targetBar"><i></i></div>
    </div>

    <div id="vitals" hidden>
      <div class="bar" id="barHealth"><i></i><span></span></div>
      <div class="bar" id="barStamina"><i></i><span></span></div>
      <div class="bar" id="barMana"><i></i><span></span></div>
      <div id="spellbar"></div>
    </div>

    <div id="deathScreen" hidden>
      <div>
        <h2>Ты пал</h2>
        <p id="deathCause"></p>
        <button id="respawnBtn">Вернуться в город</button>
      </div>
    </div>

    <div id="chat">
      <div id="chatLog"></div>
      <input id="chatInput" type="text" maxlength="200" placeholder="Сообщение…" hidden />
    </div>

    <div id="pauseHint" hidden>
      <div>
        <strong>Пауза</strong>
        Нажми, чтобы вернуться в игру<br /><br />
        ЛКМ — удар · Shift+ЛКМ — тяжёлый · ПКМ — блок · C — рывок · 1…6 — заклинания
      </div>
    </div>

    <!-- Экран входа -->
    <div class="screen" id="authScreen">
      <div class="panel">
        <h1>Grimhold</h1>
        <p class="subtitle">мрачное средневековье · подземелья с выносом добычи</p>

        <label>
          Имя учётной записи
          <input id="authUser" type="text" autocomplete="username" maxlength="16" />
        </label>
        <label>
          Пароль
          <input id="authPass" type="password" autocomplete="current-password" maxlength="72" />
        </label>

        <div class="row">
          <button id="loginBtn">Войти</button>
          <button id="registerBtn" class="ghost">Создать</button>
        </div>
        <p class="error" id="authError"></p>
        <p class="hint">Пароль от 6 символов. Хранится только его scrypt-хеш.</p>
      </div>
    </div>

    <!-- Выбор персонажа -->
    <div class="screen" id="charScreen" hidden>
      <div class="panel">
        <h1>Персонажи</h1>
        <p class="subtitle" id="charSubtitle"></p>

        <div id="charList"></div>

        <div id="createBlock">
          <h2>Новый персонаж</h2>
          <label>
            Имя
            <input id="newName" type="text" maxlength="16" />
          </label>
          <div class="row">
            <label>
              Раса
              <select id="newRace"></select>
            </label>
            <label>
              Класс
              <select id="newClass"></select>
            </label>
          </div>
          <p class="hint" id="raceHint"></p>
          <button id="createBtn">Создать персонажа</button>
        </div>

        <p class="error" id="charError"></p>
        <button id="logoutBtn" class="ghost">Сменить учётную запись</button>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
